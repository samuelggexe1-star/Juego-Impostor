<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMPOSTOR — Nueva versión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <img src="https://fv5-4.files.fm/thumb_show.php?i=k7xw2g3uak&view&v=1&PHPSESSID=dfb7db2a7df3584b3864237e79131a033ffd2fb3" alt="Logo" />
      </div>
      <div>
        <h1>IMPOSTOR</h1>
        <p class="lead">Denada por el juegazo este 👍.</p>
      </div>
    </header>

    <div class="grid">
      <!-- Panel izquierdo -->
      <div class="panel">
        <label for="listaJugadores">Nombres de jugadores (separados por comas)</label>
        <input id="listaJugadores" type="text" placeholder="Ej: Samuel, Adriel, Mateo" />

        <label style="margin-top:12px">Selecciona categorías (puedes elegir varias)</label>
        <div id="categorias-container" class="categorias-container"></div>

        <!-- Botón para seleccionar/deseleccionar todas las categorías -->
        <div style="margin-top:8px;">
          <button class="btn" id="btnToggleCategorias">Seleccionar todas</button>
        </div>

        <!-- Separación añadida para separar categorías y configuración -->
        <div style="margin-top:20px"></div>

        <!-- Botón configuración -->
        <button class="btn" id="btnConfiguracion">Configuración</button>

        <div class="row" style="margin-top:12px">
          <label style="margin:0">Impostores:</label>
          <select id="cantidadImpostores" class="small" onchange="seleccionarImpostores(parseInt(this.value))">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
          <button class="btn" onclick="nuevaRonda()">Iniciar / Nueva ronda</button>
        </div>
      </div>

      <!-- Panel derecho -->
      <div class="panel-right">
        <div class="card">
          <div id="output">Pulsa "Iniciar / Nueva ronda" para empezar</div>
        </div>

        <div class="card">
          <div id="accion"></div>
        </div>

        <div class="card">
          <label style="margin-bottom:8px; display:block">Jugadores (lista)</label>
          <div id="players" class="players-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel de Configuración (overlay) -->
  <div id="configPanel" class="config-panel hidden" aria-hidden="true">
    <div class="config-content">
      <h2>Configuración</h2>

      <label class="config-option"><input type="checkbox" id="cfgRondasEspeciales"> Rondas especiales (pequeña probabilidad de que todos sean impostores o todos inocentes)</label>
      <label class="config-option"><input type="checkbox" id="cfgPista"> Pista (al impostor se le indica la categoría de la palabra)</label>
      <label class="config-option"><input type="checkbox" id="cfgPartidaTiempo"> Partida por tiempo (3 min tras ver todas las palabras)</label>

      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn" id="cerrarConfig">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Panel de Cronómetro (overlay secundario) -->
  <div id="cronometroPanel" class="config-panel hidden" aria-hidden="true">
    <div class="config-content">
      <h2>Cronómetro</h2>
      <div id="cronometro">03:00</div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
        <button class="btn" id="iniciarCronometroBtn">Iniciar cronómetro</button>
        <button class="btn hidden" id="reiniciarCronometroBtn">Reiniciar cronómetro</button>
        <button class="btn hidden" id="nuevaRondaTiempoBtn">Nueva ronda</button>
      </div>
    </div>
  </div>

  <!-- Script (solo uno, al final) -->
  <script src="./script.js"></script>
</body>
</html>
