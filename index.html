  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMPOSTOR — Nueva versión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
  <img src="https://i.imgur.com/uUZeDJW.jpeg" alt="Logo" />
</div>
      <div>
        <h1>IMPOSTOR</h1>
        <p class="lead">Mención honorifica al putisimo Samuel Acosta Carballo que ha dedicado tiempo a hacer este juegazo.</p>
      </div>
    </header>

    <div class="grid">
      <!-- Panel izquierdo -->
      <div class="panel">
        <label for="listaJugadores">Nombres de jugadores (separados por comas)</label>
        <input id="listaJugadores" type="text" placeholder="Ej: Samuel, Adriel, Mateo" />

        <label style="margin-top:12px">Selecciona categorías (puedes elegir varias)</label>
        <div id="categorias-container" class="categorias-container"></div>

        <div class="row" style="margin-top:12px">
          <label style="margin:0">Impostores:</label>
          <select id="cantidadImpostores" class="small" onchange="seleccionarImpostores(parseInt(this.value))">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
          <button class="btn" onclick="nuevaRonda()">Iniciar / Nueva ronda</button>
        </div>
      </div>

      <!-- Panel derecho -->
      <div class="panel-right">
        <div class="card">
          <div id="output">Pulsa "Iniciar / Nueva ronda" para empezar</div>
        </div>

        <div class="card">
          <div id="accion"></div>
        </div>

        <div class="card">
          <label style="margin-bottom:8px; display:block">Jugadores (lista)</label>
          <div id="players" class="players-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
